[project]
name = "consult-rah-site-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=scripts --cov-report=term-missing --cov-fail-under=100"
